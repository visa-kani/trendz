# =============================================================================
# Nginx site for Drift Commerce on AWS Lightsail (Ubuntu).
# Install:  sudo cp infra/nginx/drift.conf /etc/nginx/sites-available/drift
#           sudo ln -s /etc/nginx/sites-available/drift /etc/nginx/sites-enabled/drift
#           sudo nginx -t && sudo systemctl reload nginx
# Replace shop.example.com with the real domain. TLS certificates come from
# Certbot (Let's Encrypt) or a Cloudflare Origin Certificate — see DEPLOYMENT.md.
# =============================================================================

# Real client IPs when Cloudflare proxies the site (orange cloud). Keep this
# list in sync with https://www.cloudflare.com/ips/ — infra/scripts/cloudflare-ips.sh
# regenerates /etc/nginx/conf.d/cloudflare-real-ip.conf.
include /etc/nginx/conf.d/cloudflare-real-ip.conf;

# Coarse abuse protection in front of the API's own per-route limits.
limit_req_zone $binary_remote_addr zone=drift_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=drift_api:10m rate=20r/s;

upstream drift_api {
    server 127.0.0.1:4100;
    keepalive 32;
}

upstream drift_web {
    server 127.0.0.1:3100;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name shop.example.com www.shop.example.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://shop.example.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name shop.example.com;

    ssl_certificate     /etc/letsencrypt/live/shop.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shop.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    server_tokens off;

    # Product images are uploaded straight to R2 with presigned URLs, so request
    # bodies through Nginx stay small (JSON + webhooks).
    client_max_body_size 2m;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;

    # --- API (Express) -------------------------------------------------------
    # Webhooks need the raw body untouched for signature checks.
    location = /api/payments/webhook { proxy_pass http://drift_api; proxy_request_buffering on; }
    location = /api/shipping/webhook { proxy_pass http://drift_api; proxy_request_buffering on; }

    location /api/auth/ {
        limit_req zone=drift_auth burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://drift_api;
    }

    location /api/ {
        limit_req zone=drift_api burst=60 nodelay;
        limit_req_status 429;
        proxy_read_timeout 60s;
        proxy_pass http://drift_api;
    }

    # --- Web (Next.js) -------------------------------------------------------
    location /_next/static/ {
        proxy_pass http://drift_web;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://drift_web;
        proxy_read_timeout 60s;
    }
}
