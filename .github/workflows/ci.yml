# CI: lint → typecheck → API tests (real Postgres, Redis and S3-compatible storage) → build.
# CD: on main, after CI passes, SSH into the Lightsail instance and run
# infra/scripts/deploy.sh (backup → migrate → reload → health check → rollback on failure).
#
# Repository configuration needed for deploys (Settings → Secrets and variables → Actions):
#   variables: DEPLOY_ENABLED=true
#   secrets:   LIGHTSAIL_HOST, LIGHTSAIL_USER (e.g. trendz), LIGHTSAIL_SSH_KEY (private key),
#              LIGHTSAIL_KNOWN_HOSTS (output of `ssh-keyscan -t ed25519 <host>`)
# Protect the "production" environment with required reviewers for a manual approval gate.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trendz
          POSTGRES_PASSWORD: trendz_ci_pw
          POSTGRES_DB: trendz_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trendz -d trendz_test" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Throwaway CI-only values; nothing here is a real credential.
      TEST_DATABASE_URL: postgresql://trendz:trendz_ci_pw@127.0.0.1:5432/trendz_test?schema=public
      TEST_REDIS_URL: redis://127.0.0.1:6379/1
      DATABASE_URL: postgresql://trendz:trendz_ci_pw@127.0.0.1:5432/trendz_test?schema=public
      REDIS_URL: redis://127.0.0.1:6379/1
      JWT_SECRET: ci-only-jwt-secret-ci-only-jwt-secret-0001
      OTP_SECRET: ci-only-otp-secret-ci-only-otp-secret-0002
      R2_ENDPOINT: http://127.0.0.1:9000
      R2_ACCESS_KEY_ID: ci_minio
      R2_SECRET_ACCESS_KEY: ci_minio_secret
      R2_BUCKET_NAME: trendz-media
      R2_PUBLIC_URL: http://127.0.0.1:9000/trendz-media
      R2_FORCE_PATH_STYLE: "true"
      WEB_URL: http://localhost:3100
      API_INTERNAL_URL: http://127.0.0.1:4100
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
      NEXT_PUBLIC_MEDIA_ORIGIN: http://127.0.0.1:9000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Start S3-compatible storage (stands in for Cloudflare R2)
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=ci_minio -e MINIO_ROOT_PASSWORD=ci_minio_secret \
            pgsty/minio:latest server /data
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:9000/minio/health/live && break; sleep 1; done

      - run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate --workspace apps/api

      - name: Create storage bucket
        run: npm run storage:init --workspace apps/api

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: API tests (incl. concurrent stock / payment idempotency)
        run: npm run test --workspace apps/api

      - name: Build
        run: npm run build

      - name: Dependency audit (production dependencies, high+)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    timeout-minutes: 30
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy ${{ github.sha }}
        env:
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
          USER: ${{ secrets.LIGHTSAIL_USER }}
        run: ssh -i ~/.ssh/id_deploy "$USER@$HOST" "/srv/trendz/bin/deploy.sh ${{ github.sha }}"
